<!doctype html>
<html lang="en" data-mission="mars_science">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UBAR · Oman Analog Atlas</title>
<meta name="description" content="Earth analogs in Oman for the Moon base and Mars, scored with an Analog Similarity Index. NASA Space Apps 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/hud.css">
<link rel="stylesheet" href="css/views.css">
<link rel="stylesheet" href="css/phone.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<script src="vendor/maplibre/maplibre-gl.js" defer></script>
</head>
<body>
  <!-- Layer 0: space scene (Orbit + Director) -->
  <div id="space-bg" aria-hidden="true"></div>
  <canvas id="space" aria-hidden="true"></canvas>
  <!-- Layer 1: destination map (Oman) -->
  <div id="map" hidden></div>
  <div id="map-vignette" hidden aria-hidden="true"></div>

  <!-- Layer 2: HUD chrome -->
  <header class="hud-top">
    <a class="brand" href="#orbit" aria-label="UBAR, Oman Analog Atlas, back to orbit" title="UBAR · Oman Analog Atlas">
      <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="ubarGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7D68E"/><stop offset="1" stop-color="#C98A2B"/></linearGradient>
          <clipPath id="ubarPlanet"><circle cx="16" cy="16" r="8.2"/></clipPath></defs>
        <path d="M2.6 19.6 A14 5.2 -18 0 1 29.4 12.4" fill="none" stroke="url(#ubarGold)" stroke-width="1.5" opacity=".55"/>
        <g clip-path="url(#ubarPlanet)"><rect x="6" y="6" width="20" height="20" fill="#D9A441"/><path d="M8 18.5 Q12 15.6 16 17.2 T25 16.4 V26 H8Z" fill="#B9772F"/><path d="M19.5 6 A8.2 8.2 0 0 1 19.5 26 A10 10 0 0 0 19.5 6Z" fill="#7A4A1E" opacity=".55"/></g>
        <path d="M29.4 12.4 A14 5.2 -18 0 1 2.6 19.6" fill="none" stroke="url(#ubarGold)" stroke-width="1.6"/>
        <circle cx="28.3" cy="13.1" r="1.6" fill="#F7D68E"/>
      </svg>
      <span class="brand-name">UBAR</span>
    </a>
    <nav class="crumbs" id="crumbs" aria-label="Location"></nav>
    <div class="hud-right">
      <div class="mission" role="radiogroup" aria-label="Mission profile" id="mission">
        <button type="button" role="radio" data-m="moon_base"><i></i>Moon base</button>
        <button type="button" role="radio" data-m="mars_landing"><i></i>Mars landing</button>
        <button type="button" role="radio" data-m="mars_science"><i></i>Mars science</button>
        <button type="button" role="radio" data-m="mars_sedimentary"><i></i>Mars sedimentary</button>
      </div>
      <span class="mock-flag" id="mockFlag" hidden>Mock data</span>
    </div>
  </header>

  <!-- Layer 3: the active view -->
  <main id="view" tabindex="-1"></main>

  <footer class="hud-bottom">
    <nav class="menu" aria-label="Sections">
      <a href="#director" data-r="director" aria-label="Choose a mission"><span class="mlong">Choose a mission</span><span class="mshort">Mission</span></a>
      <a href="#destinations" data-r="destinations" aria-label="Destinations"><span class="mlong">Destinations</span><span class="mshort">Places</span></a>
      <a href="#oman" data-r="oman">Oman</a>
      <a href="#vr" data-r="vr">VR</a>
      <a href="#method" data-r="method">Method</a>
      <a href="#sources" data-r="sources">Sources</a>
      <a href="present/" data-r="about" id="aboutLink">About</a>
    </nav>
    <div class="hud-bottom-right">
      <div class="keys" id="keys" aria-hidden="true"></div>
      <button type="button" class="fx-btn" id="fxBtn" aria-pressed="true" title="Graphics quality (G)">Graphics <b>High</b></button>
    </div>
  </footer>

  <div id="reticle" aria-hidden="true"></div>
  <div id="tip" role="tooltip" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
